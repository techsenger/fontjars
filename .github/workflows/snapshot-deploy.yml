name: Snapshot Deploy

on:
  push:
    branches: [ main ]
  pull_request:

# No permissions by default: every job asks only for what it needs.
permissions: {}

jobs:
  # The modules hold only resources and do not depend on the platform, so one system is enough.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup Java 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build and test
      run: mvn -B -U verify

  # Secrets are never given to the builds of pull requests.
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup Java 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
    - name: Generate settings.xml
      run: |
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>repsy-snapshots</id>
                <username>${{ secrets.REPSY_USERNAME }}</username>
                <password>${{ secrets.REPSY_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF
    - name: Deploy only snapshot versions
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "Detected version: $VERSION"
        if [[ $VERSION == *"SNAPSHOT"* ]]; then
          echo "Deploying snapshot version: $VERSION"
          mvn deploy -U -B -DskipTests
        else
          echo "Skipping deploy for release version: $VERSION"
        fi
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
